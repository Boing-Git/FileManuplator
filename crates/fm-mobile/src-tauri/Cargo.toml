[package]
name = "fm-mobile"
version = "0.1.0"
description = "filemanuplator for Android and iOS"
edition = "2024"
rust-version = "1.90"

[lib]
# The `_lib` suffix keeps the library name distinct from the desktop binary's.
name = "fm_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
fm-core = { path = "../../fm-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-fs = "=2.7.1"

[dev-dependencies]
# Tauri's mock runtime, to drive the commands through real IPC requests.
tauri = { version = "=2.12.5", features = ["test"] }

# This crate is outside the root workspace, so it carries its own profile.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
