app-id: org.filemanuplator.Converter
runtime: org.gnome.Platform
# NOTE: bump this as GNOME runtimes age (48 went EOL in March 2026).
# The CI workflow reads this value and installs the matching runtime.
runtime-version: '48'
sdk: org.gnome.Sdk
command: filemanuplator
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=host
modules:
  - name: filemanuplator
    buildsystem: simple
    # The Rust binary is built outside flatpak-builder (which has no network
    # access for fetching crates) and installed here.
    build-commands:
      - install -Dm755 target/release/fm-gtk /app/bin/filemanuplator
      - |
        if [ -d bin ]; then
          for engine in bin/*; do
            [ -f "$engine" ] && install -Dm755 "$engine" "/app/bin/$(basename "$engine")"
          done
        fi
    sources:
      - type: dir
        path: ../../
