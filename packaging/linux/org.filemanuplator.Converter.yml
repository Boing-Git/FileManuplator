app-id: org.filemanuplator.Converter
runtime: org.gnome.Platform
runtime-version: '45'
sdk: org.gnome.Sdk
command: filemanuplator
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=host
modules:
  - name: filemanuplator
    buildsystem: simple
    build-commands:
      - install -D src/main.py /app/bin/filemanuplator
      - cp -r src /app/src
      - cp -r bin/* /app/bin/
    sources:
      - type: dir
        path: ../../
