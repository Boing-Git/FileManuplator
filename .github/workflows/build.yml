name: Build and Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the files to (e.g. v1.2.3). Leave empty to keep them as workflow artifacts only, for testing.'
        required: false

# Without this, softprops/action-gh-release gets a 403 on repos/orgs that
# default GITHUB_TOKEN to read-only.
permissions:
  contents: write

env:
  PANDOC_VERSION: "3.1.9"
  CARGO_TERM_COLOR: always

jobs:
  # Fast feedback on every push and pull request: does it build, do the tests
  # pass, is it formatted, is clippy happy.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK development packages
        # The engines are for the tests that convert every format and run the
        # plugins for real.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libgtk-4-dev libadwaita-1-dev libssl-dev file \
            ffmpeg imagemagick pandoc par2

      - name: Check out the plugins next to this repository
        # fm-core's tests load and run every plugin from ../FM-Plugins: the
        # plugins tag matching this release when there is one, else main.
        run: |
          repo=https://github.com/Boing-Git/FileManuplator-Plugins
          ref=main
          if [[ "$GITHUB_REF" == refs/tags/* ]] &&
             git ls-remote --exit-code --tags "$repo" "$GITHUB_REF_NAME" >/dev/null; then
            ref="$GITHUB_REF_NAME"
          fi
          git clone --depth 1 --branch "$ref" "$repo" ../FM-Plugins

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  build-linux:
    # Only produce release artifacts for tags and manual runs.
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    # ubuntu-latest runners ship without FUSE, so any bare AppImage invocation
    # (linuxdeploy, the ImageMagick AppImage) fails immediately with a
    # libfuse.so.2 error. This makes every AppImage self-extract and run.
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libgtk-4-dev libadwaita-1-dev libssl-dev file \
            flatpak flatpak-builder curl wget unzip

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        # The bare executable is also published, for people who already have
        # GTK4, libadwaita and WebKitGTK 6.0 installed.
        run: |
          cargo build --release -p fm-gtk
          cp target/release/fm-gtk filemanuplator-linux-x86_64

      - name: Download Portable Engines
        run: |
          mkdir -p bin
          # Portable ffmpeg
          wget -q https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xJf ffmpeg-master-latest-linux64-gpl.tar.xz
          cp ffmpeg-master-latest-linux64-gpl/bin/ffmpeg bin/

          # Portable pandoc
          wget -q "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz"
          tar -xzf "pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz"
          cp "pandoc-${PANDOC_VERSION}/bin/pandoc" bin/

          # Portable ImageMagick (AppImage)
          wget -q https://github.com/ImageMagick/ImageMagick/releases/download/7.1.1-21/ImageMagick--gcc-x86_64.AppImage -O bin/magick
          chmod +x bin/magick bin/ffmpeg bin/pandoc

      - name: Create Tarball
        run: bash packaging/linux/build_linux.sh

      - name: Build AppImage
        run: |
          rm -rf AppDir
          mkdir -p AppDir/usr/bin
          install -m 755 target/release/fm-gtk AppDir/usr/bin/filemanuplator
          cp bin/* AppDir/usr/bin/ 2>/dev/null || true

          cat << 'EOF' > AppDir/AppRun
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          exec "${HERE}/usr/bin/filemanuplator" "$@"
          EOF
          chmod +x AppDir/AppRun

          cat << 'EOF' > AppDir/filemanuplator.desktop
          [Desktop Entry]
          Name=FileManipulator
          Exec=filemanuplator
          Icon=filemanuplator
          Type=Application
          Categories=Utility;
          EOF

          # linuxdeploy rejects a 0-byte icon outright — it must be a real,
          # square image. Use the repo's icon if present, otherwise draw a
          # plain filled circle with the ImageMagick AppImage we downloaded.
          # (A text glyph would need FreeType and fonts, which the runner
          # does not have.)
          if [ -f packaging/linux/icon.png ]; then
            cp packaging/linux/icon.png AppDir/filemanuplator.png
          else
            ./bin/magick -size 256x256 xc:'#1B3A6B' -fill '#A8C7FA' \
              -draw "circle 128,128 128,32" AppDir/filemanuplator.png
          fi

          wget -qc "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          # This plugin is what actually bundles GTK4/libadwaita's shared libs,
          # GLib schemas, GI typelibs and icon themes into the AppDir. Without
          # it the AppImage runs on the build host and breaks anywhere else.
          wget -qc "https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh"
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh
          export LINUXDEPLOY="$(pwd)/linuxdeploy-x86_64.AppImage"
          export DEPLOY_GTK_VERSION=4
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin gtk --output appimage

      - name: Build Flatpak
        run: |
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          # flatpak-builder needs the GNOME runtime installed locally before it
          # can build against it. Read the version from the manifest rather
          # than hardcoding one here, so the two cannot drift apart.
          #
          # Handle all three quote styles: an empty RUNTIME_VERSION would turn
          # "org.gnome.Platform//" into a versionless ref, which flatpak
          # resolves by fuzzy-matching every published version and prompting
          # interactively — then auto-aborting with no TTY attached.
          RUNTIME_VERSION=$(grep -oP "runtime-version[\"']?\s*:\s*[\"']?\K[0-9]+" \
            packaging/linux/org.filemanuplator.Converter.yml | head -n1)
          if [ -z "$RUNTIME_VERSION" ]; then
            echo "::error::Could not find runtime-version in packaging/linux/org.filemanuplator.Converter.yml"
            exit 1
          fi
          flatpak install --user -y --noninteractive flathub \
            "org.gnome.Platform/x86_64/${RUNTIME_VERSION}" \
            "org.gnome.Sdk/x86_64/${RUNTIME_VERSION}"
          flatpak-builder --user --repo=repo build-dir \
            packaging/linux/org.filemanuplator.Converter.yml --force-clean
          flatpak build-bundle repo filemanuplator.flatpak org.filemanuplator.Converter

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            filemanuplator-linux-x86_64
            FileManuplator-Linux.tar.gz
            FileManipulator-x86_64.AppImage
            filemanuplator.flatpak

      - name: Upload Release Assets
        if: github.event_name == 'push' || github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          files: |
            filemanuplator-linux-x86_64
            FileManuplator-Linux.tar.gz
            FileManipulator-x86_64.AppImage
            filemanuplator.flatpak
